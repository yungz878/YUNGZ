<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>YUNGZ</title>
  <style>
    body {
      margin: 0;
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(to bottom, #e0e0e0, #ffffff);
    }
    .header {
      position: relative;
      text-align: center;
      color: #000;
    }
    .header img.bg {
      width: 100%;
      height: 500px;
      object-fit: cover;
    }
    .logo {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #fff;
    }
    .title {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 60px;
      font-weight: bold;
    }
    .subtitle {
      position: absolute;
      top: 65%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 30px;
    }
    .whatsapp {
      position: absolute;
      top: 20px;
      left: 20px;
      background-color: #25D366;
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      text-decoration: none;
    }
    .product {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 40px 0;
    }
    .product img {
      width: 300px;
      height: auto;
      border-radius: 10px;
    }
    .price {
      font-size: 24px;
      margin: 10px 0;
    }
    .details-btn {
      background-color: #000;
      color: #fff;
      padding: 10px 20px;
      border: none;
      cursor: pointer;
    }
    .details {
      display: none;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="header">
    <img class="bg" src="https://example.com/store.jpg" alt="Store Background">
    <img class="logo" src="https://example.com/logo.jpg" alt="YUNGZ Logo">
    <a class="whatsapp" href="https://wa.me/201028646201" target="_blank">تواصل عبر واتساب</a>
    <div class="title">YUNGZ</div>
    <div class="subtitle">ستايل يغير اللعبة</div>
  </div>

  <div class="product">
    <img src="https://m.media-amazon.com/images/I/71dX1z6dJgL._AC_UY879_.jpg" alt="تيشيرت اندورا">
    <div class="price">السعر: 350 جنيه</div>
    <button class="details-btn" onclick="toggleDetails()">تفاصيل الخامة</button>
    <div class="details" id="details">
      <p>خامة قطن 100%، قصة عادية، أكمام قصيرة، نمط بيكيه.</p>
    </div>
  </div>

  <script>
    function toggleDetails() {
      var details = document.getElementById('details');
      if (details.style.display === 'none' || details.style.display === '') {
        details.style.display = 'block';
      } else {
        details.style.display = 'none';
      }
    }
  </script>

</body>
</html>
