<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>YUNGZ - ستايل يغير اللعبة</title>
  <link href="https://fonts.googleapis.com/css2?family=Changa:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Changa', sans-serif;
      background: linear-gradient(to bottom, #aaaaaa, #ffffff);
      color: #111;
      min-height: 100vh;
    }

    .header-image {
      width: 100%;
      height: 300px;
      object-fit: cover;
      display: block;
    }

    .content {
      padding: 60px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .logo {
      width: 160px;
      height: 160px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #444;
      box-shadow: 0 0 15px rgba(0,0,0,0.3);
      margin-bottom: 30px;
    }

    h1 {
      font-size: 300px;
      color: #000;
      margin: 10px 0;
      line-height: 1;
    }

    p {
      font-size: 36px;
      color: #444;
      margin-bottom: 40px;
    }

    .whatsapp {
      background-color: #25D366;
      color: white;
      padding: 15px 30px;
      text-decoration: none;
      font-size: 22px;
      border-radius: 10px;
      position: absolute;
      left: 30px;
      top: 30px;
    }

    .bottom-space {
      height: 300px;
    }
  </style>
</head>
<body>
  <!-- صورة المحل -->
  <img class="header-image" src="https://images.unsplash.com/photo-1603252109303-2751441dd157?auto=format&fit=crop&w=1350&q=80" alt="صورة المحل">

  <!-- زر واتساب -->
  <a href="https://wa.me/201028646201" class="whatsapp">تواصل على واتساب</a>

  <!-- المحتوى -->
  <div class="content">
    <img src="logo.png" alt="YUNGZ Logo" class="logo">
    <h1>YUNGZ</h1>
    <p>ستايل يغير اللعبة</p>
  </div>

  <!-- مساحة فاضية تحت -->
  <div class="bottom-space"></div>
</body>
</html>
