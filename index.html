<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YUNGZ</title>
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background-color: #1c1c1c;
      color: #fff;
      text-align: center;
    }
    header {
      padding: 20px;
    }
    header img {
      width: 150px;
    }
    h1 {
      font-size: 2em;
      margin: 10px 0;
      color: #f4a300;
    }
    .tagline {
      font-size: 1.2em;
      color: #ccc;
    }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      padding: 30px;
    }
    .product {
      background-color: #2a2a2a;
      border-radius: 15px;
      padding: 15px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }
    .product img {
      width: 100%;
      border-radius: 10px;
    }
    .product h2 {
      font-size: 1.1em;
      margin: 10px 0;
    }
    .product p {
      margin: 5px 0;
      color: #f4a300;
    }
    .product a {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 12px;
      background-color: #f4a300;
      color: #000;
      border-radius: 5px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <img src="logo.png" alt="YUNGZ Logo">
    <h1>YUNGZ</h1>
    <p class="tagline">ستايل يغير اللعبة</p>
  </header>

  <section class="products">
    <!-- هنا تقدر تضيف المنتجات بنفسك، انسخ البلوك دا وعدله لكل منتج -->
    <!--
    <div class="product">
      <img src="product1.jpg" alt="اسم المنتج">
      <h2>اسم المنتج</h2>
      <p>السعر</p>
      <a href="https://wa.me/201028646201" target="_blank">اطلب الآن</a>
    </div>
    -->
  </section>
</body>
</html>
